<!DOCTYPE html>
<html>
<head>
    <title>Exercise 1 - Basic LLM App</title>
</head>
<body>
    <h1>Basic SDK Code Generator</h1>
    <form action="/generate" method="post">
        <label for="prompt">Prompt:</label><br>
        <textarea name="prompt" id="prompt" rows="4" cols="50">{{ prompt if prompt else '' }}</textarea><br><br>
        <input type="submit" value="Generate SDK Code">
    </form>
    {% if response %}
        <h2>Response:</h2>
        <pre>{{ response }}</pre>
    {% endif %}
</body>
</html>
