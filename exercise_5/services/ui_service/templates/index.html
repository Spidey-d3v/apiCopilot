<!DOCTYPE html>
<html>
<head>
    <title>Enterprise API Copilot</title>
</head>
<body>
    <h1>Enterprise SDK Generator (Microservices)</h1>
    <form action="/generate" method="post">
        <label for="prompt">Prompt:</label><br>
        <textarea name="prompt" id="prompt" rows="4" cols="50">{{ prompt if prompt else '' }}</textarea><br><br>
        <input type="submit" value="Generate">
    </form>
    {% if response %}
        <h2>Generated SDK Code:</h2>
        <pre style="background: #eee; padding: 10px;">{{ response }}</pre>
    {% endif %}
</body>
</html>
