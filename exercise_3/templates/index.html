<!DOCTYPE html>
<html>
<head>
    <title>Exercise 3 - RAG Comparison</title>
</head>
<body>
    <h1>RAG vs Non-RAG Code Generator</h1>
    <form action="/generate" method="post">
        <label for="prompt">Prompt:</label><br>
        <textarea name="prompt" id="prompt" rows="4" cols="50">{{ prompt if prompt else '' }}</textarea><br><br>
        <input type="submit" value="Generate">
    </form>
    
    <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
            <h2>Without RAG:</h2>
            {% if response_norag %}
                <pre style="background: #f0f0f0; padding: 10px;">{{ response_norag }}</pre>
            {% endif %}
        </div>
        <div style="flex: 1;">
            <h2>With RAG:</h2>
            {% if response_rag %}
                <pre style="background: #e0ffe0; padding: 10px;">{{ response_rag }}</pre>
            {% endif %}
        </div>
    </div>
</body>
</html>
